<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Arts Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Quando&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stage:#14161a; --wing:#1c1f25; --ink:#f5f3ee; --paper:#ebe7df;
    --muted:#8b8f98; --line:#2a2e36; --danger:#e0563f; --r:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--stage);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
  [hidden]{display:none !important}

  .banner{background:#3b2f0e;color:#ffe9a3;font-size:13px;padding:8px 16px;text-align:center}

  .app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
  aside{background:#101216;border-right:1px solid var(--line);padding:34px 26px 26px;display:flex;flex-direction:column;gap:34px;position:sticky;top:0;height:100vh;overflow:auto}
  main{padding:0 0 80px}
  .logo,.wordmark{display:block;width:100%;max-width:200px;height:auto}
  .wordmark{fill:currentColor}
  .wordmark text{font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:41px}

  .prods{display:flex;flex-direction:column;gap:2px}
  .prod{width:100%;text-align:left;padding:13px 14px;border-radius:var(--r);display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--muted)}
  .prod:hover{background:var(--wing);color:var(--ink)}
  .prod[aria-pressed="true"]{background:var(--paper);color:var(--stage)}
  .prod .n{font-weight:600}.prod .c{font-size:12px;opacity:.7}


  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .pill{padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
  .pill:hover{color:var(--ink);border-color:var(--muted)}
  .pill[aria-pressed="true"]{background:var(--paper);color:var(--stage);border-color:var(--paper)}

  .side-actions{margin-top:auto;display:grid;gap:6px;padding-top:20px;border-top:1px solid var(--line)}
  .add{padding:12px;border-radius:var(--r);border:1px dashed var(--muted);font-weight:600}
  .add:hover{border-style:solid;background:var(--wing)}
  .ghost{padding:10px;border-radius:var(--r);color:var(--muted);font-size:13px}
  .ghost:hover{color:var(--ink);background:var(--wing)}
  .who{font-size:12px;color:var(--muted);text-align:center}

  .boardhead{display:flex;align-items:flex-end;padding:28px 32px;background:var(--stage) center/cover no-repeat;position:relative;min-height:96px}
  .boardhead.has-image{min-height:260px;padding:32px}
  .boardhead.has-image::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,22,26,.15) 0%,rgba(20,22,26,.55) 55%,rgba(20,22,26,.92) 100%)}
  .boardhead h2{font-family:"Quando",Georgia,serif;font-weight:400;font-size:34px;line-height:1.1;position:relative;z-index:1}
  .boardhead.has-image h2{font-size:46px;text-shadow:0 2px 24px rgba(0,0,0,.55)}
  .filterbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 32px 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .count{color:var(--muted);font-size:13px;flex:none}
  .board,.empty{margin-left:32px;margin-right:32px}

  .board{columns:3;column-gap:14px}
  @media (max-width:1200px){.board{columns:2}}
  .tile{break-inside:avoid;margin-bottom:14px;background:#000;border-radius:var(--r);overflow:hidden;position:relative;border:1px solid var(--line)}
  .tile.can-drag{cursor:grab}.tile.can-drag:active{cursor:grabbing}
  .tile.dragging{opacity:.35}.tile.over,.tile.pinned{border-color:var(--paper)}
  .tile .body{padding:12px 14px 14px}
  .tile h3{font-size:15px;font-weight:600;line-height:1.3}
  .tile .note{font-size:13px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tile .tag{position:absolute;top:10px;left:10px;font-size:11px;font-weight:600;background:rgba(0,0,0,.6);color:var(--paper);padding:3px 8px;border-radius:999px;backdrop-filter:blur(4px)}
  .tile .pin{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);font-size:13px;display:grid;place-items:center;opacity:0}
  .tile:hover .pin,.tile.pinned .pin,.tile .pin:focus-visible{opacity:1}

  .img{aspect-ratio:4/3;width:100%;object-fit:cover;display:block}
  .embed{aspect-ratio:16/9;width:100%;border:0;display:block;background:#000}
  .ph{aspect-ratio:4/3;display:grid;place-items:center;color:rgba(255,255,255,.55);font-size:12px;text-align:center;padding:16px;background:linear-gradient(135deg,#2a2e36,#14161a)}
  .gel{height:150px;position:relative}
  .gel .beam{position:absolute;inset:0;background:radial-gradient(ellipse 70% 90% at 50% 100%,rgba(255,255,255,.35),transparent 65%)}
  .gel .code{position:absolute;right:12px;bottom:10px;font-size:22px;font-weight:700;letter-spacing:-.02em;color:rgba(255,255,255,.92);text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .gel .rgbw{position:absolute;left:12px;bottom:12px;font-size:11px;font-weight:600;color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.6);letter-spacing:.02em}
  .swatches{display:flex;height:96px}
  .sw{flex:1;position:relative}.sw:hover{flex:1.6}
  .sw span{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:600;color:#fff;mix-blend-mode:difference;opacity:0}.sw:hover span{opacity:1}
  .wave{height:96px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#0a0b0e}
  .wave .bars{flex:1;display:flex;align-items:center;gap:2px;height:64px;min-width:0}
  .wave i{flex:1;background:var(--paper);border-radius:2px;opacity:.28;height:var(--h);transition:opacity .12s}
  .wave i.on{opacity:.9}
  .wave.static i{opacity:.85}
  .player{cursor:pointer}
  .player .bars{cursor:col-resize}
  .player .play{width:38px;height:38px;flex:none;border-radius:50%;background:var(--paper);color:var(--stage);display:grid;place-items:center;font-size:13px;line-height:1}
  .player audio{display:none}
  .player .time{flex:none;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:34px;text-align:right}
  video.img{aspect-ratio:16/9;background:#000;object-fit:contain}
  .filecard,.linkcard{display:flex;gap:12px;align-items:center;padding:16px 14px;background:#0a0b0e;text-decoration:none}
  .filecard .ico,.linkcard .ico{width:42px;height:42px;border-radius:8px;background:var(--wing);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--paper);flex:none;text-transform:uppercase}
  .filecard .meta,.linkcard .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile.note-tile{background:var(--paper);color:var(--stage);border-color:var(--paper)}
  .tile.note-tile h3{font-family:"Quando",Georgia,serif;font-weight:400;font-size:17px}
  .tile.note-tile .note{color:#4a4d54}
  /* note tiles have no media for the badge to sit on, so it goes in the flow instead */
  .tile.note-tile .tag{position:static;display:inline-block;background:rgba(0,0,0,.08);color:var(--stage);margin:12px 14px 0}
  .tile.note-tile .body{padding-top:8px}
  .tile.note-tile .pin{background:rgba(0,0,0,.1)}
  .empty{color:var(--muted);padding:60px 0;text-align:center;font-size:14px}

  /* modal, always centred in the viewport */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal{background:var(--wing);color:var(--ink);border-radius:8px;width:min(580px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 24px 24px;display:grid;gap:14px}
  .modal header{display:flex;justify-content:space-between;align-items:center}
  .modal header h2{font-size:16px;font-weight:600}
  .x{color:var(--muted);font-size:22px;line-height:1}
  .field{display:grid;gap:5px}
  .field label{font-size:12.5px;color:var(--muted)}
  .field input,.field textarea,.field select{background:var(--stage);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);padding:9px 11px;font:inherit;width:100%}
  .field input[type=file]{padding:7px}
  .field input[type=color]{height:42px;padding:4px}
  .field input[type=range]{padding:0;border:0;background:transparent}
  .field textarea{min-height:90px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .actions{display:flex;justify-content:space-between;gap:10px;margin-top:6px;flex-wrap:wrap}
  .btn{padding:9px 14px;border-radius:var(--r);font-weight:600;border:1px solid var(--line)}
  .btn.primary{background:var(--paper);color:var(--stage);border-color:var(--paper)}
  .btn.danger{color:var(--danger);border-color:transparent}
  .btn:disabled{opacity:.5;cursor:wait}
  .preview{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
  .gelprev{height:70px;border-radius:var(--r);position:relative;border:1px solid var(--line)}
  .gelprev span{position:absolute;right:10px;bottom:6px;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .gellist{display:flex;flex-wrap:wrap;gap:6px}
  .gelchip{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border:1px solid var(--line);border-radius:999px;font-size:12px}
  .gelchip i{width:16px;height:16px;border-radius:50%;display:block}
  .gelchip .rm{color:var(--muted);font-size:14px;line-height:1;padding:0 2px}
  .err{color:var(--danger);font-size:13px}
  .hint{font-size:12px;color:var(--muted)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--paper);color:var(--stage);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%)}

  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    main{padding:0 0 60px}.board{columns:1}
    .boardhead{padding:20px 16px}.boardhead.has-image{min-height:180px;padding:20px 16px}
    .boardhead h2{font-size:26px}.boardhead.has-image h2{font-size:30px}
    .filterbar{padding:16px}.board,.empty{margin-left:16px;margin-right:16px}
    .row,.row3{grid-template-columns:1fr 1fr}
  }
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="banner" id="banner" hidden></div>
<div class="app">
  <aside>
    <img class="logo" id="logo" src="logo.svg" alt="Production Arts Practice"
         onerror="this.hidden=true;document.getElementById('wordmark').removeAttribute('hidden')">
    <svg class="wordmark" id="wordmark" viewBox="0 0 240 70" role="img" aria-label="Production Arts Practice" hidden>
      <text x="0" y="29.5" textLength="240" lengthAdjust="spacingAndGlyphs">PRODUCTION</text>
      <text x="0" y="64.4" textLength="240" lengthAdjust="spacingAndGlyphs">ARTS PRACTICE</text>
    </svg>
    <nav class="prods" id="prods"></nav>
    <div class="side-actions">
      <button class="ghost" id="boardBtn" hidden>Add or edit productions</button>
      <button class="add" id="addBtn" hidden>Add a tile</button>
      <button class="ghost" id="gelBtn" hidden>Manage gels and colours</button>
      <button class="ghost" id="authBtn">Sign in to edit</button>
      <p class="who" id="who"></p>
    </div>
  </aside>
  <main>
    <header class="boardhead" id="boardhead">
      <h2 id="title"></h2>
    </header>
    <div class="filterbar">
      <div class="filters" id="filters"></div>
      <span class="count" id="count"></span>
    </div>
    <div class="board" id="board"><p class="empty">Loading the board.</p></div>
  </main>
</div>
<div class="overlay" id="overlay" hidden><div class="modal" role="dialog" aria-modal="true" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- constants ---------- */
const FILTERS = ["all","lighting","sound","video","colour","reference","links","files","notes"];
const TYPES = {
  light:   {label:"Lighting state", tag:"lighting"},
  sound:   {label:"Sound (upload or link)", tag:"sound"},
  video:   {label:"Video (upload or YouTube/Vimeo link)", tag:"video"},
  image:   {label:"Photo (upload or link)", tag:"reference"},
  palette: {label:"Colour palette", tag:"colour"},
  link:    {label:"Web link", tag:"links"},
  file:    {label:"Any file (PDF, plot, cue sheet)", tag:"files"},
  note:    {label:"Note", tag:"notes"},
};

/* ---------- state ---------- */
let boards=[], tiles=[], gels=[], user=null;
let current=null, filter="all", dragId=null;
const canEdit = () => !!user;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
const boardTiles = () => tiles.filter(t=>t.board_id===current).sort((a,b)=>a.sort-b.sort);
const gelByCode = code => gels.find(g=>g.code===code);
function waveBars(seed){ let s=(seed||7)*9301+49297,out=[]; for(let i=0;i<28;i++){ s=(s*9301+49297)%233280; out.push(20+Math.floor((s/233280)*70)); } return out.map(h=>`<i style="--h:${h}%"></i>`).join(""); }
function hashStr(str){ let h=0; for(const c of String(str)) h=(h*31+c.charCodeAt(0))>>>0; return h; }
function embedUrl(u){
  const yt=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]+)/); if(yt) return `https://www.youtube.com/embed/${yt[1]}`;
  const vm=u.match(/vimeo\.com\/(\d+)/); if(vm) return `https://player.vimeo.com/video/${vm[1]}`;
  return null;
}
function rgbwToHex(r,g,b,w){ const mix=c=>Math.round(c+(255-c)*(w/255)); return "#"+[mix(r),mix(g),mix(b)].map(v=>v.toString(16).padStart(2,"0")).join(""); }
function fileExt(name){ return (name||"").split(".").pop().slice(0,4); }

/* ---------- audio player ---------- */
function fmtTime(s){ if(!isFinite(s)||s<0) s=0; s=Math.floor(s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
function paintPlayer(w){
  const a=w.querySelector("audio"); if(!a) return;
  const bars=[...w.querySelectorAll(".bars i")];
  const frac=a.duration?a.currentTime/a.duration:0;
  bars.forEach((b,i)=>b.classList.toggle("on",(i+1)/bars.length<=frac));
  w.querySelector(".time").textContent=fmtTime(a.currentTime);
  w.querySelector(".play").innerHTML=a.paused?"&#9654;":"&#10073;&#10073;";
}
function initPlayers(root){
  root.addEventListener("click",e=>{
    const w=e.target.closest(".player"); if(!w) return;
    e.stopPropagation();
    const a=w.querySelector("audio"); if(!a) return;
    const bars=e.target.closest(".bars");
    if(bars&&a.duration){
      const r=bars.getBoundingClientRect();
      a.currentTime=Math.min(a.duration,Math.max(0,(e.clientX-r.left)/r.width*a.duration));
      return;
    }
    if(a.paused){ document.querySelectorAll(".player audio").forEach(o=>{ if(o!==a) o.pause(); }); a.play().catch(()=>toast("Could not play that file.")); }
    else a.pause();
  },true);
  ["timeupdate","play","pause","loadedmetadata","ended"].forEach(ev=>
    root.addEventListener(ev,e=>{ const w=e.target.closest?.(".player"); if(w) paintPlayer(w); },true));
}

/* ---------- api ---------- */
async function api(method, path, body){
  const r = await fetch(path,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,credentials:"same-origin"});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||`Request failed (${r.status})`);
  return j;
}
async function uploadFile(file,boardId){
  const fd=new FormData(); fd.append("file",file);
  const r=await fetch(`/api/upload?board=${encodeURIComponent(boardId||current)}`,{method:"POST",body:fd,credentials:"same-origin"});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||"Upload failed.");
  return j;
}
async function loadAll(){
  try{
    const s=await api("GET","/api/state");
    boards=s.boards; tiles=s.tiles; gels=s.gels; user=s.authenticated?s.user:null;
    if(!boards.find(b=>b.id===current)) current=boards[0]?.id||null;
    $("#banner").hidden=true;
  }catch(err){
    $("#banner").hidden=false; $("#banner").textContent="Could not reach the server. "+err.message;
  }
}

/* ---------- render ---------- */
function renderSidebar(){
  $("#prods").innerHTML = boards.map(b=>`<button class="prod" data-k="${esc(b.id)}" aria-pressed="${b.id===current}"><span class="n">${esc(b.name)}</span><span class="c">${esc(b.kind||"")}</span></button>`).join("");
  $("#filters").innerHTML = FILTERS.map(f=>`<button class="pill" data-f="${f}" aria-pressed="${f===filter}">${f[0].toUpperCase()+f.slice(1)}</button>`).join("");
  $("#addBtn").hidden=!canEdit(); $("#gelBtn").hidden=!canEdit(); $("#boardBtn").hidden=!canEdit();
  $("#authBtn").textContent = user ? "Sign out" : "Sign in to edit";
  $("#who").textContent = user ? `Editing as ${user}` : "";
}
function media(t){
  const d=t.data||{};
  switch(t.type){
    case "light": {
      const g=gelByCode(d.gel); const hex=d.hex||g?.hex||"#888"; const rgbw=d.rgbw||g?.rgbw;
      return `<div class="gel" style="background:${esc(hex)};box-shadow:inset 0 0 60px rgba(0,0,0,.35)"><div class="beam"></div>${rgbw?`<span class="rgbw">R${rgbw.r} G${rgbw.g} B${rgbw.b} W${rgbw.w}</span>`:""}<span class="code">${esc(d.gel||"")}</span></div>`;
    }
    case "sound": {
      const bars=`<div class="bars">${waveBars(hashStr(t.id)%1000)}</div>`;
      if(!d.url) return `<div class="wave static">${bars}</div>`;
      return `<div class="wave player"><button class="play" aria-label="Play ${esc(t.title)}">&#9654;</button>${bars}<span class="time">0:00</span><audio preload="metadata" src="${esc(d.url)}"></audio></div>`;
    }
    case "video": {
      if(!d.url) return `<div class="ph">No video yet. Open the tile to upload or paste a link.</div>`;
      const e=embedUrl(d.url); return e ? `<iframe class="embed" src="${esc(e)}" allowfullscreen loading="lazy" title="${esc(t.title)}"></iframe>` : `<video class="img" controls playsinline preload="metadata" src="${esc(d.url)}"></video>`;
    }
    case "image": return d.url ? `<img class="img" src="${esc(d.url)}" alt="${esc(t.title)}" loading="lazy">` : `<div class="ph">No image yet. Open the tile to upload or paste a link.</div>`;
    case "palette": return `<div class="swatches">${(d.colors||[]).map(c=>`<div class="sw" style="background:${esc(c)}" data-hex="${esc(c)}"><span>${esc(c)}</span></div>`).join("")}</div>`;
    case "link": { let host=""; try{host=new URL(d.url).hostname.replace(/^www\./,"")}catch{} return `<a class="linkcard" href="${esc(d.url||"#")}" target="_blank" rel="noopener" data-ext><span class="ico">www</span><span><strong>Open link</strong><br><span class="meta">${esc(host||"No URL yet")}</span></span></a>`; }
    case "file": return d.url ? `<a class="filecard" href="${esc(d.url)}" target="_blank" rel="noopener" data-ext><span class="ico">${esc(fileExt(d.name)||"file")}</span><span><strong>Open file</strong><br><span class="meta">${esc(d.name||"")}</span></span></a>` : `<div class="ph">No file yet. Open the tile to upload one.</div>`;
    default: return "";
  }
}
function tileHTML(t,forPreview){
  const cls=["tile",t.type==="note"?"note-tile":"",t.pinned?"pinned":"",canEdit()&&!forPreview?"can-drag":""].join(" ");
  return `<article class="${cls}" ${canEdit()&&!forPreview?'draggable="true"':""} data-id="${esc(t.id)}" tabindex="0">
    ${media(t)}<span class="tag">${esc(t.tag)}</span>
    ${canEdit()&&!forPreview?`<button class="pin" data-pin="${esc(t.id)}" aria-label="Pin tile">${t.pinned?"&#9733;":"&#9734;"}</button>`:""}
    <div class="body"><h3>${esc(t.title)}</h3><p class="note">${esc(t.note)}</p></div></article>`;
}
function renderBoard(){
  const b=boards.find(x=>x.id===current);
  if(!b){ $("#title").textContent=""; $("#count").textContent=""; setBanner(null); $("#board").innerHTML=`<p class="empty">No productions yet.${canEdit()?" Add one from the sidebar.":""}</p>`; return; }
  $("#title").textContent=b.name; setBanner(b.image);
  const all=boardTiles();
  const list=all.filter(t=>filter==="all"||t.tag===filter).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  $("#count").textContent=`${list.length} of ${all.length} tiles`;
  $("#board").innerHTML=list.length?list.map(t=>tileHTML(t)).join(""):`<p class="empty">Nothing tagged ${filter} yet.${canEdit()?" Add a tile to start.":""}</p>`;
}
function setBanner(url){
  const h=$("#boardhead");
  h.classList.toggle("has-image",!!url);
  h.style.backgroundImage=url?`url("${encodeURI(url)}")`:"";
}
function renderAll(){ renderSidebar(); renderBoard(); }

/* ---------- modal ---------- */
function openModal(html){ $("#modal").innerHTML=html; $("#overlay").hidden=false; $("#modal").querySelector("input:not([type=file]),textarea,select,button.x")?.focus(); }
function closeModal(){ $("#overlay").hidden=true; }

function typeFields(type,d={}){
  const gelOpts=gels.map(g=>`<option value="${esc(g.code)}" ${g.code===d.gel?"selected":""}>${esc(g.code)} ${esc(g.name||"")}</option>`).join("");
  const fileRow=(accept,label)=>`<div class="row">
      <div class="field"><label for="f-file">Upload ${label}</label><input id="f-file" type="file" accept="${accept}"></div>
      <div class="field"><label for="f-url">Or paste a link</label><input id="f-url" value="${esc(d.url||"")}" placeholder="https://"></div></div>
      ${d.name?`<p class="hint">Current file: ${esc(d.name)}</p>`:""}`;
  switch(type){
    case "light": return gels.length ? `<div class="field"><label for="f-gel">Gel or colour</label><select id="f-gel">${gelOpts}</select><p class="hint">Need a colour that isn't here? Close this and use "Manage gels and colours".</p></div>` : `<p class="hint">No gels yet. Close this and add one under "Manage gels and colours".</p>`;
    case "sound": return fileRow("audio/*","audio (mp3, wav, m4a)");
    case "video": return fileRow("video/*","video (mp4, mov)")+`<p class="hint">YouTube and Vimeo links will embed.</p>`;
    case "image": return fileRow("image/*","photo");
    case "file": return fileRow("*","file");
    case "link": return `<div class="field"><label for="f-url">URL</label><input id="f-url" value="${esc(d.url||"")}" placeholder="https://"></div>`;
    case "palette": return `<div class="field"><label for="f-colors">Colours (comma separated hex)</label><input id="f-colors" value="${esc((d.colors||[]).join(", "))}" placeholder="#1b1b1b, #6b6b6b, #d9d9d9"></div>`;
    default: return "";
  }
}
function openTile(id){
  const t=tiles.find(x=>x.id===id); if(!t) return;
  if(!canEdit()){
    openModal(`<header><h2>${esc(t.title)}</h2><button class="x" data-close aria-label="Close">&times;</button></header><div class="preview">${media(t)}</div><p>${esc(t.note)}</p>`);
    return;
  }
  openModal(`<header><h2>Edit tile</h2><button class="x" data-close aria-label="Close">&times;</button></header>
    <div class="preview">${tileHTML(t,true)}</div>
    <div class="field"><label for="f-title">Title</label><input id="f-title" value="${esc(t.title)}"></div>
    <div class="field"><label for="f-note">Note</label><textarea id="f-note">${esc(t.note)}</textarea></div>
    <div class="field"><label for="f-tag">Tag</label><select id="f-tag">${FILTERS.slice(1).map(f=>`<option ${f===t.tag?"selected":""}>${f}</option>`).join("")}</select></div>
    ${typeFields(t.type,t.data)}
    <p class="err" id="f-err"></p>
    <div class="actions"><button class="btn danger" data-del="${esc(t.id)}">Delete tile</button><button class="btn primary" data-save="${esc(t.id)}">Save changes</button></div>`);
}
function openAdd(){
  openModal(`<header><h2>Add a tile</h2><button class="x" data-close aria-label="Close">&times;</button></header>
    <div class="row">
      <div class="field"><label for="a-type">Type</label><select id="a-type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join("")}</select></div>
      <div class="field"><label for="f-tag">Tag</label><select id="f-tag">${FILTERS.slice(1).map(f=>`<option>${f}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label for="f-title">Title</label><input id="f-title" placeholder="What is it?"></div>
    <div class="field"><label for="f-note">Note</label><textarea id="f-note" placeholder="Why it belongs on this board, and what you'd do with it."></textarea></div>
    <div id="a-extra">${typeFields("light")}</div>
    <p class="err" id="f-err"></p>
    <div class="actions"><span></span><button class="btn primary" data-add>Add to board</button></div>`);
  $("#a-type").addEventListener("change",e=>{ $("#a-extra").innerHTML=typeFields(e.target.value); $("#f-tag").value=TYPES[e.target.value].tag; });
}
async function collectData(type,existing={}){
  const d={...existing};
  const file=$("#f-file")?.files?.[0];
  if(file){ const up=await uploadFile(file); Object.assign(d,up); }
  else if($("#f-url")){ const u=$("#f-url").value.trim(); if(u&&u!==d.url){ d.url=u; delete d.path; delete d.name; delete d.mime; } if(!u){ delete d.url; delete d.path; delete d.name; delete d.mime; } }
  if(type==="light"){ const g=gelByCode($("#f-gel")?.value); d.gel=g?.code||""; d.hex=g?.hex; d.rgbw=g?.rgbw||null; }
  if(type==="palette") d.colors=$("#f-colors").value.split(",").map(s=>s.trim()).filter(Boolean);
  return d;
}

function openGels(){
  const chips=gels.map(g=>`<span class="gelchip"><i style="background:${esc(g.hex)}"></i>${esc(g.code)}${g.name?" "+esc(g.name):""}<button class="rm" data-rmgel="${esc(g.id)}" aria-label="Remove ${esc(g.code)}">&times;</button></span>`).join("");
  openModal(`<header><h2>Gels and colours</h2><button class="x" data-close aria-label="Close">&times;</button></header>
    <div class="gellist">${chips||'<span class="hint">No gels yet.</span>'}</div>
    <div class="row">
      <div class="field"><label for="g-code">Code</label><input id="g-code" placeholder="L201 or your own, e.g. WASH-A"></div>
      <div class="field"><label for="g-name">Name</label><input id="g-name" placeholder="Full CT blue"></div>
    </div>
    <div class="field"><label for="g-mode">Set the colour by</label><select id="g-mode"><option value="hex">Picker (hex)</option><option value="rgbw">RGBW values (LED fixture)</option></select></div>
    <div id="g-hexwrap" class="field"><label for="g-hex">Colour</label><input id="g-hex" type="color" value="#7fa6d9"></div>
    <div id="g-rgbwwrap" hidden>
      <div class="row3">${["r","g","b","w"].map(c=>`<div class="field"><label for="g-${c}">${c.toUpperCase()}</label><input id="g-${c}" type="number" min="0" max="255" value="${c==="w"?0:c==="b"?200:120}"></div>`).join("")}</div>
      <p class="hint">Screen preview is an approximation of what the fixture will do. Values are stored exactly as typed.</p>
    </div>
    <div class="gelprev" id="g-prev"><span id="g-prevlabel"></span></div>
    <p class="err" id="f-err"></p>
    <div class="actions"><span></span><button class="btn primary" data-addgel>Add gel</button></div>`);
  const update=()=>{
    const mode=$("#g-mode").value;
    $("#g-hexwrap").hidden=mode!=="hex"; $("#g-rgbwwrap").hidden=mode!=="rgbw";
    const hex=mode==="hex"?$("#g-hex").value:rgbwToHex(...["r","g","b","w"].map(c=>+$("#g-"+c).value||0));
    $("#g-prev").style.background=hex; $("#g-prevlabel").textContent=($("#g-code").value||"").toUpperCase()||hex;
  };
  $("#modal").addEventListener("input",update); $("#modal").addEventListener("change",update); update();
}

function openBoards(){
  const rows=boards.map(b=>`<div class="gelchip" style="border-radius:6px;padding:6px 8px;gap:10px"><span style="flex:1"><strong>${esc(b.name)}</strong> <span class="hint">${esc(b.kind||"")}</span></span><button class="ghost" style="padding:2px 6px" data-editboard="${esc(b.id)}">Edit</button></div>`).join("");
  openModal(`<header><h2>Productions</h2><button class="x" data-close aria-label="Close">&times;</button></header>
    <div style="display:grid;gap:6px">${rows||'<span class="hint">None yet.</span>'}</div>
    <h3 style="font-size:14px;font-weight:600;margin-top:6px">Add a production</h3>
    <div class="row">
      <div class="field"><label for="b-name">Name</label><input id="b-name" placeholder="Cinderella"></div>
      <div class="field"><label for="b-kind">Type</label><input id="b-kind" placeholder="Pantomime"></div>
    </div>
    <div class="field"><label for="b-file">Banner image</label><input id="b-file" type="file" accept="image/*"><p class="hint">Sits behind the production name at the top of the board. Optional.</p></div>
    <p class="err" id="f-err"></p>
    <div class="actions"><span></span><button class="btn primary" data-addboard>Add production</button></div>`);
}
function openEditBoard(id){
  const b=boards.find(x=>x.id===id); if(!b) return;
  openModal(`<header><h2>Edit production</h2><button class="x" data-close aria-label="Close">&times;</button></header>
    <div class="row">
      <div class="field"><label for="b-name">Name</label><input id="b-name" value="${esc(b.name)}"></div>
      <div class="field"><label for="b-kind">Type</label><input id="b-kind" value="${esc(b.kind||"")}"></div>
    </div>
    <div class="field"><label for="b-file">Banner image</label><input id="b-file" type="file" accept="image/*">
      <p class="hint">${b.image?"There is one already. Choose a file to replace it.":"Sits behind the production name at the top of the board. Optional."}</p></div>
    ${b.image?`<div class="preview"><img class="img" src="${esc(b.image)}" alt=""></div>
      <button class="ghost" data-rmbanner="${esc(b.id)}" style="justify-self:start">Remove banner image</button>`:""}
    <p class="err" id="f-err"></p>
    <div class="actions"><button class="btn danger" data-delboard="${esc(b.id)}">Delete production and its tiles</button><button class="btn primary" data-saveboard="${esc(b.id)}">Save changes</button></div>`);
}
function openAuth(){
  openModal(`<header><h2>Sign in</h2><button class="x" data-close aria-label="Close">&times;</button></header>
    <p class="hint">Only the board owner can edit. Everyone else can view.</p>
    <div class="field"><label for="au-user">Username</label><input id="au-user" autocomplete="username"></div>
    <div class="field"><label for="au-pass">Password</label><input id="au-pass" type="password" autocomplete="current-password"></div>
    <p class="err" id="f-err"></p>
    <div class="actions"><span></span><button class="btn primary" data-login>Sign in</button></div>`);
  $("#au-pass").addEventListener("keydown",e=>{ if(e.key==="Enter") $("[data-login]").click(); });
}

/* ---------- events ---------- */
$("#prods").addEventListener("click",e=>{ const b=e.target.closest("[data-k]"); if(!b) return; current=b.dataset.k; renderAll(); });
$("#filters").addEventListener("click",e=>{ const b=e.target.closest("[data-f]"); if(!b) return; filter=b.dataset.f; renderAll(); });
$("#addBtn").addEventListener("click",()=>{ if(!current){ toast("Add a production first"); return; } openAdd(); });
$("#gelBtn").addEventListener("click",openGels);
$("#boardBtn").addEventListener("click",openBoards);
$("#authBtn").addEventListener("click",async()=>{ if(user){ await api("POST","/api/logout"); user=null; renderAll(); toast("Signed out"); } else openAuth(); });

$("#board").addEventListener("click",async e=>{
  if(e.target.closest("[data-ext]")||e.target.closest("audio,video,iframe")) return;
  const pin=e.target.closest("[data-pin]");
  if(pin){ const t=tiles.find(x=>x.id==pin.dataset.pin); t.pinned=!t.pinned; renderBoard(); try{ await api("PUT",`/api/tiles/${t.id}`,{pinned:t.pinned}); }catch(err){ toast(err.message); } return; }
  const sw=e.target.closest("[data-hex]");
  if(sw){ navigator.clipboard?.writeText(sw.dataset.hex).catch(()=>{}); toast(sw.dataset.hex+" copied"); return; }
  const art=e.target.closest(".tile"); if(art) openTile(art.dataset.id);
});
$("#board").addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.classList.contains("tile")) openTile(e.target.dataset.id); });

$("#board").addEventListener("dragstart",e=>{ const a=e.target.closest(".tile"); if(!a||!canEdit()) return; dragId=a.dataset.id; a.classList.add("dragging"); });
$("#board").addEventListener("dragend",e=>{ e.target.closest(".tile")?.classList.remove("dragging"); document.querySelectorAll(".over").forEach(x=>x.classList.remove("over")); });
$("#board").addEventListener("dragover",e=>{ if(!dragId) return; e.preventDefault(); const a=e.target.closest(".tile"); document.querySelectorAll(".over").forEach(x=>x.classList.remove("over")); a?.classList.add("over"); });
$("#board").addEventListener("drop",async e=>{
  e.preventDefault(); const a=e.target.closest(".tile"); if(!a||dragId===null) return;
  const list=boardTiles(); const from=list.findIndex(t=>t.id==dragId), to=list.findIndex(t=>t.id==a.dataset.id);
  dragId=null; if(from<0||to<0||from===to) return;
  const [m]=list.splice(from,1); list.splice(to,0,m); list.forEach((t,i)=>t.sort=i); renderBoard();
  try{ await api("PUT",`/api/boards/${current}/order`,{ids:list.map(t=>t.id)}); }catch(err){ toast(err.message); }
});

$("#overlay").addEventListener("click",async e=>{
  if(e.target===e.currentTarget||e.target.closest("[data-close]")){ closeModal(); return; }
  const err=$("#f-err"); const btn=e.target.closest("button"); const label=btn?.textContent;
  const busy=()=>{ if(btn){ btn.disabled=true; btn.textContent="Saving"; } };
  const unbusy=()=>{ if(btn){ btn.disabled=false; btn.textContent=label; } };
  try{
    if(btn?.dataset.save!==undefined){ busy(); const t=tiles.find(x=>x.id==btn.dataset.save);
      const data=await collectData(t.type,t.data);
      const saved=await api("PUT",`/api/tiles/${t.id}`,{title:$("#f-title").value.trim()||t.title,note:$("#f-note").value.trim(),tag:$("#f-tag").value,data});
      Object.assign(t,saved); closeModal(); renderBoard(); toast("Saved"); }
    else if(btn?.dataset.del!==undefined){ if(!confirm("Delete this tile?")) return; busy(); await api("DELETE",`/api/tiles/${btn.dataset.del}`); tiles=tiles.filter(x=>x.id!=btn.dataset.del); closeModal(); renderBoard(); toast("Tile deleted"); }
    else if(btn?.dataset.add!==undefined){ busy(); const type=$("#a-type").value;
      const data=await collectData(type);
      const t=await api("POST","/api/tiles",{board_id:current,type,tag:$("#f-tag").value,title:$("#f-title").value.trim()||"Untitled",note:$("#f-note").value.trim(),data});
      boardTiles().forEach(x=>x.sort+=1); tiles.push(t); closeModal(); filter="all"; renderAll(); toast("Added to board"); }
    else if(btn?.dataset.addgel!==undefined){ const code=$("#g-code").value.trim().toUpperCase(); if(!code){ err.textContent="Give the gel a code."; return; }
      const mode=$("#g-mode").value; const body={code,name:$("#g-name").value.trim()};
      if(mode==="hex") body.hex=$("#g-hex").value;
      else { const v=Object.fromEntries(["r","g","b","w"].map(c=>[c,Math.max(0,Math.min(255,+$("#g-"+c).value||0))])); body.rgbw=v; body.hex=rgbwToHex(v.r,v.g,v.b,v.w); }
      busy(); const g=await api("POST","/api/gels",body); gels.push(g); toast(`${code} added`); openGels(); }
    else if(btn?.dataset.rmgel!==undefined){ await api("DELETE",`/api/gels/${btn.dataset.rmgel}`); gels=gels.filter(g=>g.id!=btn.dataset.rmgel); openGels(); }
    else if(btn?.dataset.addboard!==undefined){ busy();
      let b=await api("POST","/api/boards",{name:$("#b-name").value,kind:$("#b-kind").value});
      const f=$("#b-file")?.files?.[0];
      if(f){ const up=await uploadFile(f,b.id); b=await api("PUT",`/api/boards/${b.id}`,{image:up.url}); }
      boards.push(b); current=b.id; closeModal(); renderAll(); toast("Production added"); }
    else if(btn?.dataset.editboard!==undefined){ openEditBoard(btn.dataset.editboard); }
    else if(btn?.dataset.saveboard!==undefined){ busy();
      const id=btn.dataset.saveboard, body={name:$("#b-name").value,kind:$("#b-kind").value};
      const f=$("#b-file")?.files?.[0];
      if(f){ const up=await uploadFile(f,id); body.image=up.url; }
      const b=await api("PUT",`/api/boards/${id}`,body); Object.assign(boards.find(x=>x.id===b.id),b); closeModal(); renderAll(); toast("Saved"); }
    else if(btn?.dataset.rmbanner!==undefined){ busy(); const b=await api("PUT",`/api/boards/${btn.dataset.rmbanner}`,{image:""}); Object.assign(boards.find(x=>x.id===b.id),b); closeModal(); renderAll(); toast("Banner removed"); }
    else if(btn?.dataset.delboard!==undefined){ if(!confirm("Delete this production and every tile and file on it?")) return; busy(); await api("DELETE",`/api/boards/${btn.dataset.delboard}`); boards=boards.filter(b=>b.id!==btn.dataset.delboard); tiles=tiles.filter(t=>t.board_id!==btn.dataset.delboard); current=boards[0]?.id||null; closeModal(); renderAll(); toast("Production deleted"); }
    else if(btn?.dataset.login!==undefined){ busy(); const r=await api("POST","/api/login",{username:$("#au-user").value.trim(),password:$("#au-pass").value}); user=r.user; closeModal(); await loadAll(); renderAll(); toast("Signed in"); }
  }catch(ex){ unbusy(); if(err) err.textContent=ex.message||"Something went wrong."; else toast(ex.message); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* ---------- boot ---------- */
initPlayers($("#board")); initPlayers($("#overlay"));
(async()=>{ await loadAll(); renderAll(); })();
</script>
</body>
</html>
